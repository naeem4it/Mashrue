# ==============================================================================
# Mashrue (mashrue.com) — Nginx Production Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/mashrue.conf
# Enable:   ln -s /etc/nginx/sites-available/mashrue.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate Limiting Zone (Prevents DoS on API)
limit_req_zone $binary_remote_addr zone=mashrue_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mashrue_auth_limit:10m rate=5r/s;

# 1. Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mashrue.com www.mashrue.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://mashrue.com$request_uri;
    }
}

# 2. Redirect www.mashrue.com to canonical mashrue.com (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mashrue.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/mashrue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mashrue.com/privkey.pem;

    return 308 https://mashrue.com$request_uri;
}

# 3. Main Production Server Block (HTTPS mashrue.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mashrue.com;

    # Document Root (Frontend Single Page Application)
    root /var/www/mashrue/frontend;
    index index.html;

    # SSL / TLS Modern Hardening
    ssl_certificate /etc/letsencrypt/live/mashrue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mashrue.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Request Body Size Limit (Supports Invoices, Logos, Attachments)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- A. Frontend Single Page Application (SPA Routing) ---
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- B. Static Assets Caching ---
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # --- C. Backend REST API Reverse Proxy ---
    location /api/ {
        limit_req zone=mashrue_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3033/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # --- D. Auth Rate Limiting ---
    location /api/auth/login {
        limit_req zone=mashrue_auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3033/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- E. Health Check Endpoint ---
    location /health {
        proxy_pass http://127.0.0.1:3033/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- F. Deny Hidden Files (.git, .env, etc.) ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/mashrue_access.log;
    error_log /var/log/nginx/mashrue_error.log warn;
}
