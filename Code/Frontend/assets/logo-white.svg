<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients matching Mashrue Theme -->
    <linearGradient id="mashrue-grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="mashrue-grad-blue-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <linearGradient id="mashrue-grad-indigo-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10) scale(0.65)">
    <!-- 1. Top-Left: Stylized 'm' Arch Group -->
    <g fill="url(#mashrue-grad-cyan-blue)">
      <!-- Left Pillar -->
      <rect x="15" y="10" width="13" height="34" rx="2" ry="2" />
      <!-- Middle Pillar with soft top arch -->
      <path d="M 30 10 L 36 10 C 40 10 43 13 43 17 L 43 44 L 30 44 Z" />
      <!-- Right Pillar with distinctive large rounded top-right arch -->
      <path d="M 45 15 C 45 11 48 10 51 10 C 61 10 68 17 68 27 L 68 44 L 55 44 L 55 29 C 55 23 51 21 45 21 Z" />
    </g>

    <!-- 2. Top-Right: Horizontal Block + Anchor Dot -->
    <g fill="url(#mashrue-grad-blue-indigo)">
      <rect x="74" y="20" width="38" height="18" rx="2" ry="2" />
      <rect x="69" y="37" width="7" height="7" rx="1.5" ry="1.5" />
    </g>

    <!-- 3. Bottom-Left: Horizontal Block + Anchor Dot -->
    <g fill="url(#mashrue-grad-indigo-cyan)">
      <rect x="20" y="60" width="38" height="18" rx="2" ry="2" />
      <rect x="59" y="52" width="7" height="7" rx="1.5" ry="1.5" />
    </g>

    <!-- 4. Bottom-Right: Vertical Block + Anchor Dot -->
    <g fill="url(#mashrue-grad-cyan-blue)">
      <rect x="84" y="55" width="18" height="34" rx="2" ry="2" />
      <rect x="78" y="49" width="7" height="7" rx="1.5" ry="1.5" />
    </g>
  </g>

  <!-- Typography: MASHRUE Wordmark -->
  <text x="102" y="45" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="3.5">MASHRUE</text>
  <text x="104" y="62" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.8">ENTERPRISE BMS</text>
</svg>
