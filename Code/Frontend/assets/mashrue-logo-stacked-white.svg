<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Color Theme Gradients for Mashrue -->
    <linearGradient id="mashrue-cyan-blue-stack-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mashrue-blue-indigo-stack-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="mashrue-indigo-cyan-stack-w" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Stacked Emblem (Centered) -->
  <g transform="translate(30, 15) scale(0.95)">
    <!-- 1. Top-Left: Stylized 'm' Arch Group -->
    <g fill="url(#mashrue-cyan-blue-stack-w)">
      <rect x="25" y="24" width="13" height="34" rx="2" ry="2" />
      <path d="M 40 24 L 46 24 C 50 24 53 27 53 31 L 53 58 L 40 58 Z" />
      <path d="M 55 29 C 55 25 58 24 61 24 C 71 24 78 31 78 41 L 78 58 L 65 58 L 65 43 C 65 37 61 35 55 35 Z" />
    </g>
    <!-- 2. Top-Right: Horizontal Block + Anchor Dot -->
    <g fill="url(#mashrue-blue-indigo-stack-w)">
      <rect x="84" y="34" width="38" height="18" rx="2" ry="2" />
      <rect x="79" y="51" width="7" height="7" rx="1.5" ry="1.5" />
    </g>
    <!-- 3. Bottom-Left: Horizontal Block + Anchor Dot -->
    <g fill="url(#mashrue-indigo-cyan-stack-w)">
      <rect x="30" y="74" width="38" height="18" rx="2" ry="2" />
      <rect x="69" y="66" width="7" height="7" rx="1.5" ry="1.5" />
    </g>
    <!-- 4. Bottom-Right: Vertical Block + Anchor Dot -->
    <g fill="url(#mashrue-cyan-blue-stack-w)">
      <rect x="94" y="69" width="18" height="34" rx="2" ry="2" />
      <rect x="88" y="63" width="7" height="7" rx="1.5" ry="1.5" />
    </g>
  </g>

  <!-- Centered MASHRUE Wordmark as part of logo on transparent background -->
  <text x="100" y="160" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MASHRUE</text>
  <text x="100" y="178" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ENTERPRISE BMS</text>
</svg>
